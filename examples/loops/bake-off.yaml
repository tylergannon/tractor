name: bake-off
goal: >
  Three attempts implement the same small task in isolated worktrees; a
  judge runs each one and merges the winner into the main workspace.
start: attempts

defaults:
  timeout: 600s
  fidelity: none
  max_retries: 1

# The shape for "try a couple of approaches in parallel, keep the best".
# The judge decides on demonstrated behavior, not on the reports.
# To adapt: change the task in the branch prompts and the final check.
nodes:
  - id: attempts
    type: parallel
    max_parallel: 3
    branches:
      - id: attempt_claude
        artifacts: [REPORT.md]
        codergen:
          llm_provider: anthropic
          llm_model: claude-sonnet-5
          reasoning_effort: low
          prompt: >
            Create fizzbuzz.sh in this workspace: `sh fizzbuzz.sh N` prints
            the classic FizzBuzz lines from 1 to N, one per line. Run it to
            prove it works, then write REPORT.md describing your approach
            and pasting the output of `sh fizzbuzz.sh 15`.
      - id: attempt_codex
        artifacts: [REPORT.md]
        codergen:
          llm_provider: openai
          llm_model: gpt-5.6-sol
          reasoning_effort: low
          prompt: >
            Create fizzbuzz.sh in this workspace: `sh fizzbuzz.sh N` prints
            the classic FizzBuzz lines from 1 to N, one per line. Run it to
            prove it works, then write REPORT.md describing your approach
            and pasting the output of `sh fizzbuzz.sh 15`.
      - id: attempt_gemini
        artifacts: [REPORT.md]
        codergen:
          llm_provider: gemini
          llm_model: gemini-3.1-pro-low
          reasoning_effort: low
          prompt: >
            Create fizzbuzz.sh in this workspace: `sh fizzbuzz.sh N` prints
            the classic FizzBuzz lines from 1 to N, one per line. Run it to
            prove it works, then write REPORT.md as a plain file created
            with a shell command such as a heredoc, describing your approach
            and pasting the output of `sh fizzbuzz.sh 15`.
    edges:
      - to: judge

  - id: judge
    type: parallel.fan_in
    llm_provider: anthropic
    llm_model: claude-sonnet-5
    reasoning_effort: low
    prompt: >
      Use the supplied branch evidence and worktree paths. For each branch,
      run its fizzbuzz.sh yourself and check the output; judge on
      demonstrated behavior, not on the reports. Copy the winning branch's
      fizzbuzz.sh into this main workspace, and write WINNER.md naming the
      winning branch and why it won. Do not alter any branch worktree.
    edges:
      - to: verify

  - id: verify
    type: tool
    tool_command: |
      set -eu
      test "$(sh fizzbuzz.sh 5 | tail -1)" = Buzz
      test "$(sh fizzbuzz.sh 3 | tail -1)" = Fizz
      test "$(sh fizzbuzz.sh 15 | tail -1)" = FizzBuzz
      test -f WINNER.md
    on_success: success
